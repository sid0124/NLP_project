# =============================================================================
# Model configuration — Milestone 1 (classical baselines only)
# =============================================================================
# Baselines are declared here, not in code, so a new baseline is a config entry
# plus a registry line rather than an edit to the training script (spec §12).
# Transformer / HAN configuration arrives in Milestone 2 as an `encoder:` block.
# =============================================================================

# Shared feature extractors, referenced by name from each baseline below.
vectorizers:
  tfidf_word:
    type: tfidf
    params:
      max_features: 200000
      ngram_range: [1, 2]     # unigrams + bigrams ("neural network", "vision transformer")
      min_df: 2               # drop terms appearing in a single document
      max_df: 0.9             # drop terms present in >90% of documents
      sublinear_tf: true      # 1 + log(tf); dampens repeated-term dominance
      strip_accents: unicode
      lowercase: true
      stop_words: english

baselines:
  # ---- Baseline 1 (spec §12) -------------------------------------------------
  tfidf_logreg:
    display_name: "TF-IDF + Logistic Regression"
    vectorizer: tfidf_word
    classifier:
      type: logistic_regression
      params:
        C: 4.0
        max_iter: 2000
        # Counteracts residual class imbalance without resampling text,
        # which the spec explicitly warns against (§37).
        class_weight: balanced
        # liblinear is fast on high-dimensional sparse TF-IDF and exposes
        # predict_proba, which the calibration work in a later milestone needs.
        solver: liblinear

  # ---- Baseline 2 (spec §12) -------------------------------------------------
  tfidf_svm:
    display_name: "TF-IDF + Linear SVM"
    vectorizer: tfidf_word
    classifier:
      type: linear_svc
      params:
        C: 0.5
        class_weight: balanced
        max_iter: 5000
        dual: auto
      # NOTE: LinearSVC exposes decision_function but not predict_proba.
      # The evaluation layer degrades gracefully and skips probability-only
      # metrics for this model rather than failing.

# =============================================================================
# Scientific Transformer encoder (SciBERT) — Milestone 2+
# Consumed by the TransformerClassifier baseline and by SciBERT + HAN.
# =============================================================================
encoder:
  # allenai/scibert_scivocab_uncased is a BERT trained on 1.14M papers from
  # Semantic Scholar. "uncased" halves the tokenizer's vocabulary size and is
  # the standard cheap SciBERT choice for CPU training.
  model_name: "allenai/scibert_scivocab_uncased"
  # Sequences are truncated to this many tokens. Long papers are handled
  # hierarchically (sections -> sentences -> batches) — never crammed whole
  # into the sequence (spec §8).
  max_seq_length: 256
  batch_size: 16
  # Pooling over the final hidden state to produce a fixed sentence vector.
  #   mean -> mean over non-padded tokens (default, robust)
  #   cls  -> the CLS token vector (BERT-style)
  pooling: mean
  # Directory where sentence embeddings are cached on disk, keyed by a hash of
  # the input text, so repeated inference never recomputes unchanged sentences.
  cache_dir: data/embeddings
  # "auto" picks CUDA when available and falls back to CPU.
  device: auto

# =============================================================================
# Hierarchical Attention Network (Milestone 2+) — spec §7
# =============================================================================
han:
  # Per-sentence BiGRU hidden size (each direction contributes half).
  sentence_hidden_size: 256
  # Per-section BiGRU hidden size.
  section_hidden_size: 256
  # Dropout applied to sentence embeddings and the document representation.
  dropout: 0.5
  # Word-level hidden size (used only by the word-level HAN variant that
  # embeds raw tokens; the SciBERT variant skips the word encoder).
  word_hidden_size: 128

# =============================================================================
# Long-document processing bounds — spec §8
# All values are configurable here; nothing in the codebase hard-codes them.
# =============================================================================
longdoc:
  # A paper's first N sections are used; the tail (appendix, references) is
  # typically noise for domain classification.
  max_sections: 8
  # Per section, at most this many sentences are encoded downstream.
  max_sentences_per_section: 32

# =============================================================================
# Neural training behaviour (TransformerClassifier + HAN) — Milestone 2+
# =============================================================================
neural_training:
  epochs: 10
  learning_rate: 2.0e-5
  batch_size: 16
  weight_decay: 0.01
  warmup_steps: 0
  # Stop after this many epochs without an improvement on the validation
  # primary metric. 0 disables early stopping.
  early_stopping_patience: 3
  # Max gradient norm for clipping; 0 disables clipping.
  gradient_clip_norm: 1.0
  # true -> train only the classification head on top of frozen SciBERT
  # embeddings (fast, CPU-friendly, strong baseline).
  # false -> fine-tune the encoder too (much slower; needs GPU for realistic
  # runtimes on a full corpus).
  freeze_encoder: true
  # Class-imbalance handling (spec §9):
  #   none     -> unweighted softmax cross-entropy
  #   balanced -> inverse class-frequency weights fed to the loss
  #   focal    -> Focal Loss with gamma below (Lin et al. 2017)
  class_weighting: balanced
  focal_gamma: 2.0

training:
  # Which split drives model selection; test is touched only for final numbers.
  eval_split: val
  # Also score the test split at the end of a run.
  score_test: true
  # Persist the fitted pipeline to results/<run_id>/model.joblib
  save_model: true

evaluation:
  # Averaging strategies reported for every run (spec §13).
  averages: [macro, micro, weighted]
  # Macro F1 is the headline metric: it weights every class equally and so is
  # not flattered by good performance on the largest class alone.
  primary_metric: macro_f1
  per_class_metrics: true
  # Multi-label-only metric; computed when labels.mode == multilabel.
  hamming_loss: true
  plots:
    confusion_matrix: true
    class_distribution: true
    normalize_confusion_matrix: true
    dpi: 150
    figure_format: png
